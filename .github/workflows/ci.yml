name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '9.6.0'

jobs:
  # ============================================
  # Code Quality & Testing
  # ============================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-key-for-mocked-tests' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper versioning

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm run lint || echo "::warning::Linting issues detected - see logs for details"
        continue-on-error: true

      - name: Type check
        run: pnpm run check || echo "::warning::Type checking not fully configured"

      - name: Run tests - deep-tree-echo-core
        run: pnpm --filter deep-tree-echo-core test -- --coverage

      - name: Run tests - @deltecho/shared
        run: pnpm --filter @deltecho/shared test -- --coverage

      - name: Run tests - dove9
        run: pnpm --filter dove9 test -- --coverage

      - name: Run tests - @deltecho/cognitive
        run: pnpm --filter @deltecho/cognitive test -- --coverage || echo "::warning::cognitive tests pending"

      - name: Run tests - @deltecho/reasoning
        run: pnpm --filter @deltecho/reasoning test -- --coverage || echo "::warning::reasoning tests pending"

      - name: Run tests - @deltecho/eventa
        run: pnpm --filter @deltecho/eventa test -- --coverage

      - name: Build deep-tree-echo-core for downstream tests
        run: pnpm --filter deep-tree-echo-core build

      - name: Run tests - deep-tree-echo-orchestrator
        run: pnpm --filter deep-tree-echo-orchestrator test -- --coverage --forceExit

      - name: Run tests - @deltecho/sys6-triality
        run: pnpm --filter @deltecho/sys6-triality test -- --coverage || echo "::warning::sys6-triality tests pending"

      - name: Run tests - @deltecho/double-membrane
        run: pnpm --filter @deltecho/double-membrane test -- --coverage || echo "::warning::double-membrane tests pending"

      - name: Run tests - tree-polytope-kernel
        run: npx jest --config jest.config.js --no-coverage --forceExit --testPathPattern="deep-tree-echo-core/src/__tests__/tree-polytope-kernel"

      - name: Verify orchestrator cognitive tests
        run: |
          echo "Verifying cognitive-tick-processor, autonomy-lifecycle, and mail-security tests..."
          pnpm --filter deep-tree-echo-orchestrator test -- --forceExit --no-coverage --testPathPattern="(cognitive-tick-processor|autonomy-lifecycle|mail-security)"

      - name: Verify Dove9 conversational bridge tests
        run: |
          echo "Verifying dove9-conversational-bridge, orchestrator-echoagentloop, and agent-coordinator-toolengine tests..."
          pnpm --filter deep-tree-echo-orchestrator test -- --forceExit --no-coverage --testPathPattern="(dove9-conversational-bridge|orchestrator-echoagentloop-integration|agent-coordinator-toolengine)"

      - name: Verify Level 5 True Autonomy tests
        run: |
          echo "Verifying Lucy VM, Reservoir Feedback, ENACTION wiring, and Continuous Training tests..."
          pnpm --filter deep-tree-echo-orchestrator test -- --forceExit --no-coverage --testPathPattern="(lucy-vm-deployment|reservoir-feedback-loop|enaction-reservoir-wiring|continuous-training-pipeline)"

      - name: Verify Level 6 Symbiotic Autonomy tests
        run: |
          echo "Verifying Lucy HF Deploy, Production Wiring, Echoself Introspection, and System 5 Telemetry tests..."
          pnpm --filter deep-tree-echo-orchestrator test -- --forceExit --no-coverage --testPathPattern="(lucy-hf-deploy|production-wiring|echoself-introspection|system5-telemetry-shell)"

      - name: Build all packages
        run: pnpm run build

      - name: Upload coverage
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v4
        with:
          files: |
            ./deep-tree-echo-core/coverage/lcov.info
            ./packages/shared/coverage/lcov.info
            ./dove9/coverage/lcov.info
            ./packages/cognitive/coverage/lcov.info
            ./packages/reasoning/coverage/lcov.info
            ./packages/eventa/coverage/lcov.info
            ./deep-tree-echo-orchestrator/coverage/lcov.info
            ./packages/sys6-triality/coverage/lcov.info
            ./packages/double-membrane/coverage/lcov.info
          flags: unittests
          name: deltecho-coverage
          fail_ci_if_error: false

  # ============================================
  # Security Scanning
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=high || echo "::warning::Security vulnerabilities detected"

  # ============================================
  # Build Core Packages
  # ============================================
  build-core:
    name: Build Core Packages
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core packages in order
        run: |
          echo "Building deep-tree-echo-core..."
          pnpm --filter deep-tree-echo-core build
          echo "Building @deltecho/shared..."
          pnpm --filter @deltecho/shared build
          echo "Building dove9..."
          pnpm --filter dove9 build
          echo "Building @deltecho/eventa..."
          pnpm --filter @deltecho/eventa build
          echo "Building @deltecho/cognitive..."
          pnpm --filter @deltecho/cognitive build
          echo "Building @deltecho/reasoning..."
          pnpm --filter @deltecho/reasoning build || echo "::warning::reasoning build skipped"
          echo "Building deep-tree-echo-orchestrator..."
          pnpm --filter deep-tree-echo-orchestrator build
          echo "Building @deltecho/ui-components..."
          pnpm --filter @deltecho/ui-components build || echo "::warning::ui-components build requires additional setup"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-packages
          path: |
            deep-tree-echo-core/dist
            packages/shared/dist
            packages/cognitive/dist
            packages/reasoning/dist
            dove9/dist
            packages/eventa/dist
            deep-tree-echo-orchestrator/dist
            packages/ui-components/dist
          retention-days: 7

  # ============================================
  # Build Desktop Applications
  # ============================================
  build-desktop:
    name: Build Desktop (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: build-core
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
          # macOS builds
          - os: macos-latest
            platform: darwin
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          # Windows builds
          - os: windows-latest
            platform: win32
            arch: x64
          - os: windows-latest
            platform: win32
            arch: ia32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core packages
        run: pnpm run build

      - name: Build Electron app (deltecho2)
        run: pnpm run build:electron || echo "::warning::Electron build not fully configured"
        working-directory: deltecho2
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Build Electron app (delta-echo-desk)
        run: pnpm run build:electron || echo "::warning::Electron build not fully configured"
        working-directory: delta-echo-desk
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            deltecho2/dist
            delta-echo-desk/dist
          retention-days: 7

  # ============================================
  # Root Jest E2E (hard gate, runs on PRs AND push)
  # ============================================
  # Package-level E2E suites under tests/e2e/ (membrane transport, gesture
  # glyph, trajectory distribution). Self-contained: no browser, no backend.
  jest-e2e:
    name: Jest E2E (packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jest E2E suite
        run: pnpm run test:e2e

  # ============================================
  # Cognitive Integration E2E (hard gate, runs on PRs AND push)
  # ============================================
  # Runs against a self-contained harness that boots the real browser-safe
  # cognitive system, so it is fast, deterministic, and independent of the full
  # Delta Chat backend. Unlike the `e2e-tests` job below (push/main only), this
  # job runs on pull_request too, so it can actually block a broken PR.
  cognitive-e2e:
    name: Cognitive Integration E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: deltecho2/packages/e2e-tests

      - name: Install Playwright Chromium (delta-echo-desk)
        run: pnpm exec playwright install --with-deps chromium
        working-directory: delta-echo-desk/packages/e2e-tests

      - name: Run Cognitive Integration E2E (real gate)
        run: pnpm run e2e:cognitive:real
        working-directory: deltecho2/packages/e2e-tests

      - name: Run Cognitive Integration E2E (delta-echo-desk)
        run: pnpm run e2e:cognitive:real
        working-directory: delta-echo-desk/packages/e2e-tests

  # ============================================
  # E2E Tests (Linux only for speed)
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build-core
    timeout-minutes: 30
    # Harness-backed suites are hard-gated in `cognitive-e2e` on every PR;
    # this job additionally runs the full-app suites against the in-repo mock
    # chatmail backend on PRs and main pushes.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      CI: true
      NODE_TLS_REJECT_UNAUTHORIZED: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (delta-echo-desk)
        run: pnpm exec playwright install --with-deps chromium
        working-directory: delta-echo-desk/packages/e2e-tests

      - name: Install Playwright browsers (deltecho2)
        run: pnpm exec playwright install --with-deps chromium
        working-directory: deltecho2/packages/e2e-tests

      - name: Build packages
        run: pnpm run build

      # Delta Echo Desk E2E Tests
      # Harness-backed suites (deterministic, hard gates). These run against
      # the self-contained cognitive harness via playwright.cognitive.config.ts
      # and must not fail.
      - name: Run E2E tests - Harness suites (delta-echo-desk)
        run: pnpm run e2e:cognitive:real
        working-directory: delta-echo-desk/packages/e2e-tests
        env:
          CI: true
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      # Full-app suites. Onboarding now uses the in-repo mock chatmail server
      # (bin/mock-chatmail.mjs) started by playwright.config.ts. Suites that
      # still require live message transport (group invite, qr secure-join)
      # keep their warning fallback until the mock implements IMAP/SMTP.
      - name: Run E2E tests - Basic (delta-echo-desk)
        run: pnpm exec playwright test basic-tests.spec.ts || echo "::warning::Basic E2E tests need live chatmail transport (set E2E_LIVE_CHATMAIL=1)"
        working-directory: delta-echo-desk/packages/e2e-tests
        env:
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD || 'test-password' }}
          CI: true
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      # Deltecho2 E2E Tests
      # Harness-backed suites (deterministic, hard gate) — all 10 cognitive
      # suites run in the `cognitive-e2e` job above; this step re-runs them
      # here so a main-branch push surfaces regressions in the tracking
      # context too.
      - name: Run E2E tests - Harness suites (deltecho2)
        run: pnpm run e2e:cognitive:real
        working-directory: deltecho2/packages/e2e-tests
        env:
          CI: true
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      # Full-app suites against the mock chatmail backend.
      - name: Run E2E tests - Basic (deltecho2)
        run: pnpm exec playwright test basic-tests.spec.ts || echo "::warning::Basic E2E tests need live chatmail transport (set E2E_LIVE_CHATMAIL=1)"
        working-directory: deltecho2/packages/e2e-tests
        env:
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD || 'test-password' }}
          CI: true
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      - name: Run E2E tests - Group (deltecho2)
        run: pnpm exec playwright test group-tests.spec.ts || echo "::warning::Group E2E tests need live chatmail transport (set E2E_LIVE_CHATMAIL=1)"
        working-directory: deltecho2/packages/e2e-tests
        env:
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD || 'test-password' }}
          CI: true
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      - name: Run E2E tests - QR Code (deltecho2)
        run: pnpm exec playwright test qrcode-tests.spec.ts || echo "::warning::QR-code E2E tests need live chatmail transport (set E2E_LIVE_CHATMAIL=1)"
        working-directory: deltecho2/packages/e2e-tests
        env:
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD || 'test-password' }}
          CI: true
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            delta-echo-desk/packages/e2e-tests/playwright-report
            delta-echo-desk/packages/e2e-tests/test-results
            deltecho2/packages/e2e-tests/playwright-report
            deltecho2/packages/e2e-tests/test-results
          retention-days: 7

  # ============================================
  # Release (on tags)
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, build-core, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Documentation
  # ============================================
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API documentation
        run: pnpm run docs || echo "::warning::Documentation generation not configured"

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/api
          retention-days: 30

  # ============================================
  # Docker Build
  # ============================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-core
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
