# Native Dove9 Chatmail processing plugin.
#
# The module is built as lib25_dove9_cognitive_plugin.so from
# dovecot-core/src/plugins/dove9-cognitive and depends on Dovecot's notify
# plugin. Every committed mail delivery is converted into a Dove9 process.

mail_plugins = $mail_plugins notify dove9_cognitive

protocol imap {
  mail_plugins = $mail_plugins notify dove9_cognitive
}

protocol lmtp {
  mail_plugins = $mail_plugins notify dove9_cognitive
}

plugin {
  dove9_cognitive_enabled = yes
  dove9_bot_email = echo@deltecho.local
  dove9_milter_socket = /var/run/dovecot/milter.sock
  dove9_lmtp_socket = /var/run/dovecot/lmtp.sock
  dove9_step_duration_ms = 100
  dove9_max_processes = 64
}
